name: Cliks Buisness CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cliks_business

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Show Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Buisness-APK
          path: cliks_business/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Buisness-AAB
          path: cliks_business/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: cliks_business

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package iOS application
        run: |
          cd build/ios/iphoneos
          tar -czf Runner.app.tar.gz Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Buisness-iOS
          path: cliks_business/build/ios/iphoneos/Runner.app.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop (Release)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: cliks_business

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows ZIP Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Cliks-Buisness-Windows-x64.zip

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Buisness-Windows
          path: cliks_business/Cliks-Buisness-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Desktop (Release)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cliks_business

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux tar.gz Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../Cliks-Buisness-Linux-x64.tar.gz .

      - name: Upload Linux Application
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Buisness-Linux
          path: cliks_business/Cliks-Buisness-Linux-x64.tar.gz
          if-no-files-found: error

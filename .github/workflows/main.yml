name: Build & Release CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # ANDROID
  # ============================================================
  build-android:

    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./cliks_business

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Business-Android-APK
          path: cliks_business/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Business-Android-AAB
          path: cliks_business/build/app/outputs/bundle/release/app-release.aab


  # ============================================================
  # IOS
  # ============================================================
  build-ios:

    name: Build iOS Application
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./cliks_business

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package iOS App
        run: |
          cd build/ios/iphoneos
          tar -czf Runner.app.tar.gz Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Business-iOS
          path: cliks_business/build/ios/iphoneos/Runner.app.tar.gz

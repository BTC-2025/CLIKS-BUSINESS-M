name: Build & Release CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual one-click trigger from the Actions tab

jobs:
  # ============================================================================
  # Android Build Job (Generates APK & App Bundle AAB)
  # ============================================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cliks_business

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Business-Release-APK
          path: cliks_business/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Business-Release-AAB
          path: cliks_business/build/app/outputs/bundle/release/app-release.aab

  # ============================================================================
  # iOS Build Job (Compiles iOS Runner for App Store / TestFlight)
  # ============================================================================
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cliks_business

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          tar -czf Runner.app.tar.gz Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cliks-Business-iOS-Runner
          path: cliks_business/build/ios/iphoneos/Runner.app.tar.gz
